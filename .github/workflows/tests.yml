name: Tests

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install from source
        run: python -m pip install .
      - name: Unit and Tkinter tests
        run: python -m unittest discover -v
      - name: Installed CLI and package resources outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          wasdify --lang en games --json
          wasdify --lang ru patches --game dungeons-of-kremlin
          wasdify-gui --help

